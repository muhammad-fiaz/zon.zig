name: "\U0001F4D6 Documentation"
description: Report documentation issues or suggest improvements
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
      description: Describe the documentation issue or improvement.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: "Where is the issue located? (e.g., README, API docs, guide page)"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Content
      description: What does the current documentation say? (if applicable)
    validations:
      required: false
  - type: textarea
    id: improvement
    attributes:
      label: Suggested Improvement
      description: How should the documentation be improved?
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context here.
    validations:
      required: false
