name: "\U0001F41B Bug Report"
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: "e.g., Windows 11, Ubuntu 22.04, macOS 14"
    validations:
      required: true
  - type: input
    id: zig-version
    attributes:
      label: Zig Version
      description: "e.g., 0.16.0"
    validations:
      required: true
  - type: input
    id: zon-version
    attributes:
      label: zon.zig Version
      description: "e.g., 0.0.5"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide a minimal code example that reproduces the issue.
      render: zig
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or logs here.
    validations:
      required: false
